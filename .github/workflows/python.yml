name: Python engineering checks

on:
  push:
    branches: [version1, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,legacy]"
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests and coverage
        run: python -m pytest --cov=residual_material_cnn --cov-report=term-missing --cov-report=xml
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed wheel outside checkout
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, 'tools/check_wheel.py', str(wheel)], check=True)
