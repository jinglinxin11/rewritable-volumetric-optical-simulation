[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewritable-volumetric-residual-cnn"
version = "0.2.0"
description = "Ideal three-bank differential material encoding for a compact MNIST CNN"
readme = "docs/residual_material_cnn/README_CN.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "torch>=2.0,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "pytest-cov>=4,<8", "ruff>=0.8,<1", "build>=1.2,<2"]
legacy = ["scikit-learn>=1.6,<2", "matplotlib>=3.10,<4"]

[project.scripts]
residual-material-cnn = "residual_material_cnn.cli:main"

[project.urls]
Repository = "https://github.com/jinglinxin11/rewritable-volumetric-optical-simulation"
Issues = "https://github.com/jinglinxin11/rewritable-volumetric-optical-simulation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
residual_material_cnn = ["assets/*.npz", "assets/models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "tests/unit/**/*.py", "tests/integration/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["residual_material_cnn"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
